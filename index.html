<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kefu Christmas 2026</title>
  <meta name="description" content="Teams, quiz questions and game votes for the Kefu family Christmas.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-inner">
      <div>
        <p class="eyebrow" id="sleeps">Christmas 2026</p>
        <h1>Kefu Christmas</h1>
      </div>
      <div class="whoami" id="whoami" hidden>
        <span id="whoami-name"></span>
        <button class="btn ghost small" id="signout" type="button">Log out</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- Sign up / log in -->
    <section id="auth" class="auth" hidden>
      <div class="mode-switch" role="tablist">
        <button type="button" role="tab" id="mode-new" class="is-on" aria-selected="true">I'm new here</button>
        <button type="button" role="tab" id="mode-back" aria-selected="false">I've been here before</button>
      </div>
      <form id="auth-form" class="card stack" novalidate>
        <p id="auth-intro" class="lede">Put your full name in and choose a 4-digit PIN. You'll use them to get back in.</p>
        <label for="auth-name">Your full name</label>
        <input id="auth-name" name="name" autocomplete="name" autocapitalize="words" placeholder="First and last name" required>
        <label for="auth-pin">4-digit PIN</label>
        <input id="auth-pin" name="pin" inputmode="numeric" pattern="\d{4}" maxlength="4" autocomplete="off" placeholder="••••" required>
        <p class="hint" id="auth-pin-hint">Pick a new one. Please don't reuse your bank card PIN.</p>
        <p class="error" id="auth-error" role="alert" hidden></p>
        <button class="btn" type="submit" id="auth-submit">Join the Christmas fun</button>
      </form>
    </section>

    <!-- Signed-in app -->
    <section id="app" hidden>
      <nav class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="teams">Teams</button>
        <button type="button" role="tab" data-tab="quiz">Quiz</button>
        <button type="button" role="tab" data-tab="games">Games</button>
        <button type="button" role="tab" data-tab="admin" id="admin-tab" hidden>Organiser</button>
      </nav>
      <div id="tab-teams" class="panel" hidden></div>
      <div id="tab-quiz" class="panel" hidden></div>
      <div id="tab-games" class="panel" hidden></div>
      <div id="tab-admin" class="panel" hidden></div>
    </section>

    <p id="loading" class="hint center">Loading…</p>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="art.js"></script>
  <script src="app.js"></script>
</body>
</html>
